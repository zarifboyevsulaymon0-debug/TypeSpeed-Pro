<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeSpeed Pro - Speed Typing Test</title>
    
    <!-- CSS STYLES -->
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --accent: #58a6ff;
            --success: #2ea043;
            --danger: #da3633;
            --text: #c9d1d9;
            --text-dim: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 35px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent);
            font-size: 2rem;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-card span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-card h2 {
            font-size: 1.8rem;
            color: var(--accent);
        }

        .text-display {
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            font-size: 1.25rem;
            line-height: 1.6;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            user-select: none;
            max-height: 180px;
            overflow-y: auto;
        }

        .text-display span {
            position: relative;
        }

        .text-display span.correct {
            color: var(--success);
        }

        .text-display span.incorrect {
            color: var(--danger);
            background: rgba(218, 54, 51, 0.2);
            border-radius: 2px;
        }

        .text-display span.active {
            color: var(--accent);
            text-decoration: underline;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            color: var(--text);
            font-size: 1.1rem;
            outline: none;
            resize: none;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        button {
            background: var(--accent);
            color: #0d1117;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⌨️ TypeSpeed Pro</h1>
            <p>Klaviaturada yozish tezligingiz va aniqligingizni sinab ko'ring</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <span>Vaqt</span>
                <h2 id="time">60s</h2>
            </div>
            <div class="stat-card">
                <span>WPM (So'z/daq)</span>
                <h2 id="wpm">0</h2>
            </div>
            <div class="stat-card">
                <span>CPM (Belgi/daq)</span>
                <h2 id="cpm">0</h2>
            </div>
            <div class="stat-card">
                <span>Aniqlik</span>
                <h2 id="accuracy">100%</h2>
            </div>
        </div>

        <div class="text-display" id="textDisplay"></div>

        <textarea id="inputArea" placeholder="Testni boshlash uchun bu yerga yozishni boshlang..." spellcheck="false"></textarea>

        <div class="actions">
            <button onclick="resetTest()">Qayta Boshlash 🔄</button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const sampleTexts = [
            "Dasturlashni o'rganish sabr va doimiy amaliyotni talab qiladigan jarayondir. Har kuni yangi kod yozish va xatolar ustida ishlash orqali tajriba oshirib boriladi.",
            "Zamonaviy axborot texnologiyalari dunyoni jadal sur'atlar bilan o'zgartirmoqda. Sun'iy intellekt va avtomatlashtirish kelajak kasblarining asosiy poydevori bo'lib xizmat qiladi.",
            "Muaffaqiyat kaliti doimiylikda va to'xtab qolmaslikdadir. Kichik qadamlar bilan har kuni olg'a intilish katta natijalarga olib keladigan eng to'g'ri yo'ldir."
        ];

        let timeLeft = 60;
        let timer = null;
        let isTesting = false;
        let charIndex = 0;
        let mistakes = 0;

        const textDisplay = document.getElementById('textDisplay');
        const inputArea = document.getElementById('inputArea');
        const timeEl = document.getElementById('time');
        const wpmEl = document.getElementById('wpm');
        const cpmEl = document.getElementById('cpm');
        const accuracyEl = document.getElementById('accuracy');

        function loadText() {
            const randomIndex = Math.floor(Math.random() * sampleTexts.length);
            textDisplay.innerHTML = "";
            sampleTexts[randomIndex].split("").forEach(char => {
                let span = document.createElement("span");
                span.innerText = char;
                textDisplay.appendChild(span);
            });
            textDisplay.querySelectorAll("span")[0].classList.add("active");
        }

        function initTyping() {
            const characters = textDisplay.querySelectorAll("span");
            let typedChar = inputArea.value.split("")[charIndex];

            if (charIndex < characters.length && timeLeft > 0) {
                if (!isTesting) {
                    isTesting = true;
                    timer = setInterval(startTimer, 1000);
                }

                if (typedChar == null) {
                    if (charIndex > 0) {
                        charIndex--;
                        if (characters[charIndex].classList.contains("incorrect")) {
                            mistakes--;
                        }
                        characters[charIndex].classList.remove("correct", "incorrect");
                    }
                } else {
                    if (characters[charIndex].innerText === typedChar) {
                        characters[charIndex].classList.add("correct");
                    } else {
                        mistakes++;
                        characters[charIndex].classList.add("incorrect");
                    }
                    charIndex++;
                }

                characters.forEach(span => span.classList.remove("active"));
                if (charIndex < characters.length) {
                    characters[charIndex].classList.add("active");
                }

                // Statistika hisobi
                let correctChars = charIndex - mistakes;
                let accuracy = charIndex > 0 ? Math.round((correctChars / charIndex) * 100) : 100;
                let cpmVal = Math.round((correctChars / (60 - timeLeft)) * 60);
                let wpmVal = Math.round((correctChars / 5) / ((60 - timeLeft) / 60));

                cpmEl.innerText = isNaN(cpmVal) || cpmVal < 0 || !cpmVal ? 0 : cpmVal;
                wpmEl.innerText = isNaN(wpmVal) || wpmVal < 0 || !wpmVal ? 0 : wpmVal;
                accuracyEl.innerText = accuracy + "%";
            } else {
                clearInterval(timer);
                inputArea.value = "";
            }
        }

        function startTimer() {
            if (timeLeft > 0) {
                timeLeft--;
                timeEl.innerText = timeLeft + "s";
            } else {
                clearInterval(timer);
                inputArea.disabled = true;
            }
        }

        function resetTest() {
            loadText();
            clearInterval(timer);
            timeLeft = 60;
            charIndex = 0;
            mistakes = 0;
            isTesting = false;
            inputArea.disabled = false;
            inputArea.value = "";
            timeEl.innerText = "60s";
            wpmEl.innerText = "0";
            cpmEl.innerText = "0";
            accuracyEl.innerText = "100%";
        }

        inputArea.addEventListener("input", initTyping);
        loadText();
    </script>
</body>
</html>
